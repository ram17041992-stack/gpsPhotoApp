name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk GpsPhotos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gps-photo-app
          path: GpsPhotos.apk
      # Keeps one "latest" release on main with the newest APK, easy to open from a phone.
      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest GpsPhotos.apk --target "$GITHUB_SHA" \
            --title "GPS Photos – latest build" \
            --notes "Install GpsPhotos.apk on Android 10 or newer. Built from ${GITHUB_SHA::7}."
