name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Same signing key every build, so a new APK installs over the old one and keeps your data.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore
      - run: ./gradlew testReleaseUnitTest assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk GpsPhotos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gps-photo-app
          path: GpsPhotos.apk
      # Keeps one "latest" release on main with the newest APK, easy to open from a phone.
      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest GpsPhotos.apk --target "$GITHUB_SHA" \
            --title "GPS Photos – latest build" \
            --notes "Install GpsPhotos.apk on Android 10 or newer. Built from ${GITHUB_SHA::7}."

  # Installs the release APK on an emulator and takes photos online and offline.
  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: gps-photo-app
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: bash ci/device-smoke-test.sh GpsPhotos.apk
